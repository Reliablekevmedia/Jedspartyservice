# Builds the website and publishes it with GitHub Pages.
# Runs on every push to the default branch, or by hand from the Actions tab.
# One-time setup: repository Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# The address comes from GitHub Pages itself, so it keeps working if the repository moves to
# another account/organization or a custom domain (jedspartyservices.com) is added.
name: Website

on:
  push:
    branches: [main, claude/sweet-fermat-rpj8oq]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Publish only from the repository's default branch.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: pages
        uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
        working-directory: website
      - run: npm run build
        working-directory: website
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          SITE_BASE: ${{ steps.pages.outputs.base_path }}
          # Demo phase: keeps the site out of Google. Delete this line at launch.
          PUBLIC_PREVIEW: "true"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
