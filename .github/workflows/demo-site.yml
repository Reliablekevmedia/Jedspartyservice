# Builds the website and publishes the demo at https://reliablekevmedia.github.io/Jedspartyservice/
# Runs on every push to the main branch, or by hand from the Actions tab.
# One-time setup: repository Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# The demo is hidden from search engines (noindex) until the site moves to jedspartyservices.com.
name: Demo site

on:
  push:
    branches: [claude/sweet-fermat-rpj8oq]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: https://reliablekevmedia.github.io
          SITE_BASE: /Jedspartyservice
          PUBLIC_PREVIEW: "true"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
