# Netlify settings. The site is an Astro project in website/ (same setup as RK).
[build]
  base = "website"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# The old Weebly site used .html addresses. Send them to the new clean addresses.
[[redirects]]
  from = "/services.html"
  to = "/services"
  status = 301

[[redirects]]
  from = "/about.html"
  to = "/about"
  status = 301

[[redirects]]
  from = "/policies.html"
  to = "/policies"
  status = 301

[[redirects]]
  from = "/contact.html"
  to = "/contact"
  status = 301
