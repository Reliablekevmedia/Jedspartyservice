# Netlify settings. The site is an Astro project in website/.
[build]
  base = "website"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Demo phase: keeps the .netlify.app address out of Google.
  # Delete this line when jedspartyservices.com is connected and the site goes live.
  PUBLIC_PREVIEW = "true"

# The old Weebly site used .html addresses. Send them to the new clean addresses.
[[redirects]]
  from = "/services.html"
  to = "/services"
  status = 301

[[redirects]]
  from = "/about.html"
  to = "/about"
  status = 301

[[redirects]]
  from = "/policies.html"
  to = "/policies"
  status = 301

[[redirects]]
  from = "/contact.html"
  to = "/contact"
  status = 301
