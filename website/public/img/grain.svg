<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <!-- Fine, sharp grain for the matte finish (vector: rendered crisp at any screen density) -->
  <filter id="n" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="1.15" numOctaves="1" seed="4" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 .62  0 0 0 0 .58  0 0 0 0 .52  0 0 0 .09 0"/>
  </filter>
  <rect width="240" height="240" filter="url(#n)"/>
</svg>
